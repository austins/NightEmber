name: Test

on: [ workflow_call, workflow_dispatch ]

permissions:
    contents: read

jobs:
    test:
        runs-on: windows-latest
        env:
            NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   uses: ./.github/actions/setup-dotnet-environment
            -   name: Restore dependencies
                run: dotnet restore ./tests/NightEmber.Tests.Unit --locked-mode
            -   name: Test
                run: dotnet test --no-restore -c Release --results-directory ./test-results -- --report-xunit-ctrf
            -   if: always()
                name: Publish test report
                uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1.3.2
                with:
                    report-path: ./test-results/*.ctrf
                    summary-report: true
                    file-report: true
                    failed-folded-report: true
                    skipped-report: true
