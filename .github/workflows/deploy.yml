name: Deploy

on:
    release:
        types: [ published ]

jobs:
    test:
        uses: ./.github/workflows/test.yml
    deploy:
        needs: test
        permissions:
            attestations: write
            contents: write
            id-token: write
        environment: release
        runs-on: windows-latest
        env:
            NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
            RELEASE_TAG: ${{ github.event.release.tag_name }}
        steps:
            -   name: Validate release tag
                run: |
                    $tag = "$env:RELEASE_TAG" -replace '^v', ''
                    $parsed = $null
                    if (-not [System.Management.Automation.SemanticVersion]::TryParse($tag, [ref]$parsed)) {
                        Write-Output "::error::Release tag '$env:RELEASE_TAG' is not a valid version. Expected MAJOR.MINOR.PATCH[-prerelease], with an optional leading 'v'."
                        exit 1
                    }
                    $version = "$($parsed.Major).$($parsed.Minor).$($parsed.Patch)"
                    if ($parsed.PreReleaseLabel) {
                        $version += "-$($parsed.PreReleaseLabel)"
                    }
                    "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   uses: ./.github/actions/setup-dotnet-environment
            -   name: Publish executable
                run: dotnet publish ./src/NightEmber -c Release /p:PublishProfile=win-x64 /p:RestoreLockedMode=true /p:Version=$env:VERSION
            -   name: Write checksum
                working-directory: ./src/NightEmber/bin/publish/win-x64
                run: |
                    $hash = (Get-FileHash -Algorithm SHA256 NightEmber.exe).Hash.ToLowerInvariant()
                    [System.IO.File]::WriteAllText("$PWD/NightEmber.exe.sha256", "$hash  NightEmber.exe`n")
            -   name: Attest build provenance
                uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
                with:
                    subject-path: ./src/NightEmber/bin/publish/win-x64/NightEmber.exe
            -   name: Upload release assets
                run: gh release upload "$env:RELEASE_TAG" ./src/NightEmber/bin/publish/win-x64/NightEmber.exe ./src/NightEmber/bin/publish/win-x64/NightEmber.exe.sha256 --clobber
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
